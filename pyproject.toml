[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-chat-sft"
version = "0.1.0"
description = "Prepare WhatsApp chat exports and fine-tune compatible causal language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "transformers>=4.46",
    "datasets>=3.0",
    "peft>=0.13",
    "trl>=0.16",
    "bitsandbytes>=0.45",
]

[project.scripts]
whatsapp-llm = "whatsapp_llm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]